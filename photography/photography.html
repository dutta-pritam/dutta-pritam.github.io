<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A collection of my photography and captured moments.">
  <title>Photography — Pritam Dutta</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/style.css">
  <style>
    :root {
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Styled photography header title */
    h1 {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 2.75rem;
      font-weight: 400;
      font-style: italic;
      letter-spacing: -0.02em;
    }

    h3 { font-size: 1.1rem; }

    .meta, figcaption {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.5rem;
    }

    /* Small controls */
    .gallery-tools {
      display: flex;
      gap: .65rem;
      flex-wrap: wrap;
      margin: 1.25rem 0 0;
    }

    .gallery-tools button {
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      border-radius: 999px;
      padding: .5rem .85rem;
      cursor: pointer;
      font: inherit;
      transition: transform .2s var(--ease), background .2s ease;
    }

    .gallery-tools button:hover {
      transform: translateY(-2px);
      background: rgba(127,127,127,.10);
    }

    /* Photography Grid */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.25rem;
      margin-top: 1.5rem;
    }

    .photo-gallery figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      opacity: 0;
      transform: translateY(22px);
      animation: reveal .7s var(--ease) forwards;
    }

    .photo-gallery figure:nth-child(2n) { animation-delay: .05s; }
    .photo-gallery figure:nth-child(3n) { animation-delay: .1s; }
    .photo-gallery figure:nth-child(4n) { animation-delay: .15s; }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #f0f0f0;
      aspect-ratio: 4 / 3;
      box-shadow: 0 8px 24px rgba(0,0,0,.06);
      transition: transform .35s var(--ease), box-shadow .35s var(--ease);
    }

    .photo-gallery img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .65s var(--ease), filter .4s ease;
    }

    .photo-gallery figure:hover .photo-card {
      transform: translateY(-5px);
      box-shadow: 0 16px 34px rgba(0,0,0,.12);
    }

    .photo-gallery figure:hover img {
      transform: scale(1.045);
      filter: saturate(1.05);
    }

    .photo-card::after {
      content: "View";
      position: absolute;
      inset: auto 12px 12px auto;
      padding: .35rem .65rem;
      border-radius: 999px;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: .72rem;
      letter-spacing: .03em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity .25s ease, transform .25s var(--ease);
      pointer-events: none;
    }

    .photo-gallery figure:hover .photo-card::after {
      opacity: 1;
      transform: translateY(0);
    }

    figcaption {
      transition: transform .25s var(--ease);
    }

    .photo-gallery figure:hover figcaption {
      transform: translateX(3px);
    }

    /* Lightbox */
    .lightbox {
      display: flex;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 1.5rem;
      box-sizing: border-box;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease, visibility .3s ease;
    }

    .lightbox.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-content {
      max-width: min(92vw, 1100px);
      max-height: 78vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      transform: scale(.94) translateY(12px);
      transition: transform .45s var(--ease);
    }

    .lightbox.active .lightbox-content {
      transform: scale(1) translateY(0);
    }

    .lightbox-caption {
      color: #fff;
      margin-top: .9rem;
      font-size: .95rem;
      text-align: center;
      max-width: 80vw;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      background: rgba(255,255,255,.10);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      cursor: pointer;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      font-size: 1.5rem;
      line-height: 1;
      transition: transform .2s ease, background .2s ease;
    }

    .lightbox-close {
      top: 1.2rem;
      right: 1.2rem;
    }

    .lightbox-nav.prev { left: 1.2rem; }
    .lightbox-nav.next { right: 1.2rem; }

    .lightbox-close:hover,
    .lightbox-nav:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,.2);
    }

    .photo-count {
      color: rgba(255,255,255,.75);
      font-size: .8rem;
      margin-top: .35rem;
    }

    @keyframes reveal {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 600px) {
      .photo-gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; }
      .photo-card { border-radius: 7px; }
      figcaption { font-size: .75rem; }
      .lightbox-nav { width: 38px; height: 38px; }
    }
  </style>

    <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
    <button class="lightbox-nav prev" aria-label="Previous photo">&#8249;</button>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
    <button class="lightbox-nav next" aria-label="Next photo">&#8250;</button>
    <div class="lightbox-caption" id="lightbox-caption"></div>
    <div class="photo-count" id="photo-count"></div>
  </div>

  <script src="../assets/ripple.js"></script>
  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const photoCount = document.getElementById('photo-count');
    const closeBtn = document.querySelector('.lightbox-close');
    const prevBtn = document.querySelector('.lightbox-nav.prev');
    const nextBtn = document.querySelector('.lightbox-nav.next');
    const gallery = document.querySelector('.photo-gallery');
    const shuffleBtn = document.getElementById('shuffleBtn');
    const motionBtn = document.getElementById('motionBtn');

    let figures = [...document.querySelectorAll('.photo-gallery figure')];
    let current = 0;
    let motionPaused = false;

    function openLightbox(index) {
      figures = [...document.querySelectorAll('.photo-gallery figure')];
      current = (index + figures.length) % figures.length;
      const figure = figures[current];
      const img = figure.querySelector('img');
      const caption = figure.querySelector('figcaption');

      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightboxCaption.textContent = caption ? caption.textContent : '';
      photoCount.textContent = `${current + 1} / ${figures.length}`;

      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      lightboxImg.src = '';
      document.body.style.overflow = '';
    }

    function move(step) {
      openLightbox(current + step);
    }

    function shufflePhotos() {
      const items = [...gallery.children];
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        gallery.appendChild(items[j]);
        items.splice(j, 1);
      }
      figures = [...gallery.querySelectorAll('figure')];
      figures.forEach((figure, i) => {
        figure.style.animation = 'none';
        figure.offsetHeight;
        figure.style.animation = `reveal .7s var(--ease) ${Math.min(i * .025, .4)}s forwards`;
      });
    }

    figures.forEach((figure, index) => {
      figure.addEventListener('click', () => openLightbox(index));
    });

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', () => move(-1));
    nextBtn.addEventListener('click', () => move(1));

    lightbox.addEventListener('click', e => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') move(-1);
      if (e.key === 'ArrowRight') move(1);
    });

    shuffleBtn.addEventListener('click', shufflePhotos);

    motionBtn.addEventListener('click', () => {
      motionPaused = !motionPaused;
      document.body.classList.toggle('motion-paused', motionPaused);
      motionBtn.textContent = motionPaused ? 'Play motion' : 'Pause motion';
      motionBtn.setAttribute('aria-pressed', String(motionPaused));
    });
  </script>
  <style>
    .motion-paused .photo-gallery figure {
      animation-play-state: paused !important;
    }
    .motion-paused .photo-gallery figure:hover img {
      transform: none;
    }
  </style>

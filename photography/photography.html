  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.6;
    }
    h1 {
      font-size: 1.5rem;
    }
    h3 {
      font-size: 1.1rem;
    }
    .meta, figcaption {
      font-size: 0.85rem;
      color: #666;
      margin-top: 0.5rem;
    }
    
    /* Photography Grid Styling */
    .photo-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }
    .photo-gallery figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      cursor: pointer;
    }
    .photo-gallery img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
      object-fit: cover;
      aspect-ratio: 4 / 3;
      background-color: #f0f0f0;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .photo-gallery figure:hover img {
      opacity: 0.9;
      transform: scale(1.01);
    }

    /* Lightbox Modal Styling */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(5px);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 2rem;
      box-sizing: border-box;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox-content {
      max-width: 90%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lightbox-caption {
      color: #fff;
      margin-top: 1rem;
      font-size: 0.95rem;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: 1.5rem;
      right: 2rem;
      background: none;
      border: none;
      color: #fff;
      font-size: 2rem;
      cursor: pointer;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .lightbox-close:hover {
      opacity: 1;
    }
  </style>
</head>

  <!-- Lightbox Overlay Structure -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" aria-label="Close lightbox">&times;</button>
    <img class="lightbox-content" id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <script src="../assets/ripple.js"></script>
  <script>
    // Lightbox Functionality
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');
    const closeBtn = document.querySelector('.lightbox-close');
    const figures = document.querySelectorAll('.photo-gallery figure');

    figures.forEach(figure => {
      figure.addEventListener('click', () => {
        const img = figure.querySelector('img');
        const caption = figure.querySelector('figcaption');
        
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightboxCaption.textContent = caption ? caption.textContent : '';
        lightbox.classList.add('active');
      });
    });

    const closeLightbox = () => {
      lightbox.classList.remove('active');
      lightboxImg.src = '';
    };

    closeBtn.addEventListener('click', closeLightbox);
    
    // Close when clicking on the background backdrop
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) {
        closeLightbox();
      }
    });

    // Close on Escape key press
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && lightbox.classList.contains('active')) {
        closeLightbox();
      }
    });
  </script>
